databases:
  - name: netacad_db
    plan: free
    databaseName: computer_networks
    user: inkartursungalieva

services:
  - type: web
    name: netacad-ethereal-inkar
    plan: free
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: netacad_db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.localhost,127.0.0.1"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      # Gemini API Key — задать в Dashboard Render
      - key: GEMINI_API_KEY
        sync: false
      # Пароль приложения Gmail — задать в Dashboard Render
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: SITE_DOMAIN
        value: "netacad-ethereal-inkar.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://netacad-ethereal-inkar.onrender.com"
    healthCheckPath: /

